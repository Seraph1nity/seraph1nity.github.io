<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- icon -->
    <link rel="icon" href="./assets/img/Icon.png">

    <!-- embed -->
    <meta property="og:title" content="Sera's skidplace">
    <meta property="og:description" content="Sera's little website for random stuff kek">
    <meta property="og:url" content="https://Sera.is-a.dev/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://seraph1nity.github.io/assets/img/Icon.png">
    <meta name="theme-color" content="#696969">

    <title>sera's fumo viewer</title>

    <!-- setup -->
    <noscript><meta http-equiv="refresh" content="0; url=/noscript.html"></noscript>
    <script>
        const hour = new Date().getHours();
        const isNight = hour >= 18 || hour < 8;
        const background = isNight ? "NightlyBg" : "Bg";
        document.documentElement.style.backgroundImage = `url("assets/img/${background}.png")`;
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        html {
            background: center / cover no-repeat;
        }

        #imgui-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #three-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        #three-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="imgui-canvas"></canvas>
    <div id="three-container"></div>
    <script src="./Modules/oneko.js"></script>
    <script type="module" src="./Modules/main.js"></script>
</body>
</html>
