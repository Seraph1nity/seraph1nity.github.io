<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

#zoom {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#zoom button {
    width: 42px;
    height: 42px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    color: #fff;
    font: 24px monospace;
    cursor: pointer;
}

#zoom button:hover {
    background: #292929;
}

#zoom button:active {
    background: #444;
}
</style>
